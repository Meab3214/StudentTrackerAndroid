plugins { id 'com.android.application' }

android {
    namespace 'com.example.studenttracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.studenttracker'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '4.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
